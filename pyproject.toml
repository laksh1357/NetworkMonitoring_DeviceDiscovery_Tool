[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-monitoring-tool"
version = "0.2.0"
description = "NOC Operations Intelligence Engine & Device Discovery Tool"
readme = "README.md"
authors = [
    {name = "Lakshya Singh"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
desktop = [
    "customtkinter>=5.2.2",
    "plyer>=2.1.0",
    "scapy>=2.5.0",
]
dev = [
    "pytest",
    "scapy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*", "desktop*"]

[project.scripts]
lan-watchtower = "src.api.server:main"
